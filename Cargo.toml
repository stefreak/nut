[workspace]
members = ["crates/nut-core", "crates/nut-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/stefreak/nut"
homepage = "https://github.com/stefreak/nut"

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1.49.0", features = ["full", "tokio-macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1.2.1"

# Core library dependencies
chrono = "0.4.43"
config = "0.15"
directories = "6.0.0"
futures-util = "0.3.31"
octocrab = { version = "0.49.5", features = ["stream"] }
walkdir = "2.5.0"

# CLI dependencies
clap = { version = "4.5.54", features = ["derive", "string"] }
miette = { version = "7", features = ["fancy"] }

# Internal crates
nut-core = { path = "crates/nut-core" }
