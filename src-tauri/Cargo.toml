[package]
name = "nut-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "nut-tauri"

[[bin]]
name = "nut-tauri"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nut-core = { path = "../crates/nut-core", features = ["typescript"] }
specta = { version = "2.0.0-rc.20", features = ["derive"] }
specta-typescript = "0.0.7"
tauri-specta = { version = "2.0.0-rc.20", features = ["typescript"] }
tokio = { version = "1", features = ["full"] }
octocrab = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
